<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover 启用安全区域；禁止用户缩放，避免双指手势与页面缩放冲突 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>东明学校数字校园</title>
<script>
/* 禁用 Trae 内置浏览器注入的 @vite/client HMR，防止页面反复刷新导致模型加载中断 */
(function() {
  // 拦截 WebSocket，阻止 HMR 连接
  var OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    // 仅阻止 HMR 的 WebSocket 连接（ws://localhost 或 ws://127.0.0.1）
    if (/^ws:\/\/(localhost|127\.0\.0\.1)/.test(url)) {
      return { addEventListener: function(){}, send: function(){}, close: function(){}, readyState: 3 };
    }
    return protocols ? new OrigWS(url, protocols) : new OrigWS(url);
  };
  window.WebSocket.prototype = OrigWS.prototype;
  // 阻止 HMR 触发的页面重载（仅在模型加载期间）
  var origReload = window.location.reload.bind(window.location);
  window.__modelLoading = true;
  window.location.reload = function() {
    if (window.__modelLoading) { console.warn('[hmr-block] 页面重载已被阻止（模型加载中）'); return; }
    origReload();
  };
})();
</script>
<style>
  /* ============================ 全局基础样式 ============================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 禁止系统文本选择，避免长按误选 */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* 3D 渲染画布：全屏铺底，touch-action:none 由 JS 配合 passive:false 双保险阻止默认手势 */
  #canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none;
  }
  #gridCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1;
    pointer-events: none;
  }

  /* ============================ 加载遮罩 ============================ */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loading.fade-out { opacity: 0; pointer-events: none; }
  #loading .welcome { font-size: 22px; font-weight: 600; letter-spacing: 2px; margin-bottom: 14px; text-align: center; padding: 0 20px; }
  #loading .loading-text { font-size: 14px; opacity: 0.8; margin-bottom: 28px; }
  #loading .bar { width: 60%; max-width: 320px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
  #loading .bar > i { display: block; height: 100%; width: 0%; background: #fff; transition: width 0.2s linear; }
  #loading .pct { font-size: 12px; opacity: 0.6; margin-top: 10px; }

  /* ============================ 操作提示浮层 ============================ */
  #hint {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    text-align: center; font-size: 13px; line-height: 1.6;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0));
    opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; }

  /* ============================ 键鼠按键说明（桌面） ============================ */
  .keys-help {
    position: fixed; z-index: 35; pointer-events: none;
    left: calc(env(safe-area-inset-left) + 22px);
    bottom: calc(env(safe-area-inset-bottom) + 26px);
    padding: 14px 16px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    color: #fff; font-size: 13px; line-height: 1.9;
    display: none; /* 仅在键鼠设备上由 JS 打开 */
    transition: opacity 0.3s ease;
  }
  .keys-help.show { display: block; }
  .keys-help.locked { opacity: 0; }
  .keys-help .k-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .keys-help .k-row > span { opacity: 0.85; margin-left: 4px; }
  .keys-help kbd {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.28);
    border-bottom-width: 2px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: #fff;
    margin-right: 2px;
  }
  .keys-help .k-tip {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    text-align: center;
  }

  /* ============================ 方向键 D-Pad（移动端） ============================ */
  #dpad {
    position: fixed; z-index: 30;
    left: calc(env(safe-area-inset-left) + 22px);
    bottom: calc(env(safe-area-inset-bottom) + 28px);
    width: 120px; height: 120px;
    display: none;
    grid-template-areas: ". up ." "left mid right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 4px;
    touch-action: none;
  }
  #dpad.active { display: grid; }
  #dpad .dpad-btn {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    color: rgba(255,255,255,0.8);
    font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
    -webkit-user-select: none; user-select: none;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  #dpad .dpad-btn.pressed {
    background: rgba(255,255,255,0.35);
    transform: scale(0.92);
  }
  #dpad .dpad-up    { grid-area: up; }
  #dpad .dpad-left  { grid-area: left; }
  #dpad .dpad-mid   { grid-area: mid; }
  #dpad .dpad-right { grid-area: right; }
  #dpad .dpad-down  { grid-area: down; }
  /* 锁定指针时隐藏 Canvas 上的光标；Esc 退出后浏览器自动恢复 */
  #canvas.locked, body.pl-locked #canvas { cursor: none !important; }

  /* ============================ 拍照按钮 ============================ */
  #photoBtn {
    position: fixed; z-index: 30;
    right: calc(env(safe-area-inset-right) + 22px);
    bottom: calc(env(safe-area-inset-bottom) + 26px);
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 24px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  #photoBtn:active { transform: scale(0.92); background: rgba(0,0,0,0.3); }

  /* ============================ 设置按钮 ============================ */
  #settingsBtn {
    position: fixed; z-index: 30;
    right: calc(env(safe-area-inset-right) + 22px);
    bottom: calc(env(safe-area-inset-bottom) + 92px);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  #settingsBtn:active { transform: scale(0.92); background: rgba(0,0,0,0.3); }

  /* ============================ 设置面板 ============================ */
  #settingsPanel {
    position: fixed; z-index: 55;
    right: calc(env(safe-area-inset-right) + 16px);
    bottom: calc(env(safe-area-inset-bottom) + 150px);
    width: 260px;
    background: rgba(20,20,20,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    padding: 16px;
  }
  #settingsPanel.open { opacity: 1; visibility: visible; transform: translateY(0); }
  #settingsPanel .sp-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600; margin-bottom: 14px;
  }
  #settingsPanel .sp-close {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  #settingsPanel .sp-close:hover { color: #fff; }
  #settingsPanel .sp-item { margin-bottom: 16px; }
  #settingsPanel .sp-item:last-child { margin-bottom: 0; }
  #settingsPanel .sp-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; opacity: 0.85; margin-bottom: 8px;
  }
  #settingsPanel .sp-value {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; color: #fff; opacity: 1;
    min-width: 48px; text-align: right;
  }
  /* 自定义 range 滑块 */
  #settingsPanel input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.2);
    outline: none; cursor: pointer;
  }
  #settingsPanel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #settingsPanel input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; cursor: pointer; border: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  /* ============================ 性能监控面板 ============================ */
  #perfPanel {
    position: fixed; z-index: 38;
    top: calc(env(safe-area-inset-top) + 50px);
    left: calc(env(safe-area-inset-left) + 12px);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.7;
    color: #fff; white-space: pre;
    display: none; pointer-events: none;
    backdrop-filter: blur(6px);
    min-width: 150px;
  }
  #perfPanel.show { display: block; }
  #perfPanel .pf-fps-good { color: #7fdb7f; }
  #perfPanel .pf-fps-ok   { color: #ffd87f; }
  #perfPanel .pf-fps-bad  { color: #ff7f7f; }

  /* 设置面板内的开关行 */
  #settingsPanel .sp-toggle-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; opacity: 0.9;
  }
  #settingsPanel .sp-switch {
    position: relative; display: inline-block;
    width: 36px; height: 20px; flex-shrink: 0;
  }
  #settingsPanel .sp-switch input { opacity: 0; width: 0; height: 0; }
  #settingsPanel .sp-switch-slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    transition: background 0.2s ease;
  }
  #settingsPanel .sp-switch-slider::before {
    content: ""; position: absolute;
    width: 14px; height: 14px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%;
    transition: transform 0.2s ease;
  }
  #settingsPanel .sp-switch input:checked + .sp-switch-slider {
    background: rgba(127,219,127,0.6);
  }
  #settingsPanel .sp-switch input:checked + .sp-switch-slider::before {
    transform: translateX(16px);
  }

  /* ============================ 文字输入模态框 ============================ */
  #modal {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  #modal.open { display: flex; }
  #modal .card {
    width: 100%; max-width: 440px;
    background: rgba(20,20,20,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 18px;
  }
  #modal .prompt { font-size: 14px; opacity: 0.85; margin-bottom: 10px; }
  #modal textarea {
    width: 100%; height: 70px; resize: none;
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    padding: 10px; font-size: 15px; line-height: 1.4;
    /* 模态框内允许选择与输入 */
    -webkit-user-select: text; user-select: text;
  }
  #modal .preview-wrap { margin: 12px 0; text-align: center; }
  #modal .preview-wrap canvas {
    max-width: 100%; max-height: 46vh; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  /* 背景选择区 */
  #modal .bg-section { margin: 10px 0 6px; }
  #modal .bg-section .bg-label { font-size: 13px; opacity: 0.7; margin-bottom: 6px; }
  #modal .bg-section .bg-grid {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  #modal .bg-section .bg-thumb {
    flex: 0 0 48px; width: 48px; height: 48px; border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.2); cursor: pointer;
    background-size: cover; background-position: center;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  #modal .bg-section .bg-thumb:active { transform: scale(0.92); }
  #modal .bg-section .bg-thumb.selected { border-color: #fff; }
  #modal .bg-section .bg-thumb.none {
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: rgba(255,255,255,0.5);
  }
  #modal .btns { display: flex; gap: 10px; }
  #modal .btns button {
    flex: 1; padding: 11px 0; font-size: 14px;
    border: none; border-radius: 8px; cursor: pointer;
  }
  #modal .btn-save { background: rgba(255,255,255,0.15); color: #fff; }
  #modal .btn-with { background: #fff; color: #000; }

  /* ============================ 错误 / 不支持提示 ============================ */
  #error, #nowebgl {
    position: fixed; inset: 0; z-index: 70;
    background: #000; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px;
  }
  #error.show, #nowebgl.show { display: flex; }
  #error .msg, #nowebgl .msg { font-size: 15px; opacity: 0.85; margin-bottom: 20px; line-height: 1.6; }
  #error button {
    padding: 10px 22px; font-size: 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
  }

  /* ============================ 移动端分享降级全屏图 ============================ */
  #shareView {
    position: fixed; inset: 0; z-index: 80; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
  }
  #shareView.show { display: flex; }
  #shareView img { max-width: 100%; max-height: 86vh; }
  #shareView .tip { margin-top: 14px; font-size: 14px; opacity: 0.8; }
  #shareView .close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px; font-size: 20px; background: none; border: none; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <!-- 加载遮罩：welcomeText + loadingText + 进度条 -->
  <div id="loading">
    <div class="welcome" id="welcomeText">欢迎回家——东明学校</div>
    <div class="loading-text" id="loadingText">正在为你打开校门...</div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="pct" id="progressPct"></div>
  </div>

  <!-- 3D 渲染画布 -->
  <canvas id="canvas" tabindex="0"></canvas>
  <canvas id="gridCanvas"></canvas>

  <!-- 操作提示（通用短暂浮层） -->
  <div id="hint"></div>

  <!-- 键鼠按键说明（仅桌面显示；锁定指针时隐藏） -->
  <div id="keysHelp" class="keys-help">
    <div class="k-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>飞行</span></div>
    <div class="k-row"><kbd>Q</kbd><kbd>E</kbd><span>下降/上升</span></div>
    <div class="k-row"><kbd>拖动</kbd><span>视角</span></div>
    <div class="k-row"><kbd>R</kbd><span>重置视角</span></div>
    <div class="k-tip" id="keysTip">拖动画面旋转视角</div>
  </div>

  <!-- 方向键 D-Pad（仅触屏设备显示） -->
  <div id="dpad">
    <button class="dpad-btn dpad-up" data-key="w" aria-label="前进">▲</button>
    <button class="dpad-btn dpad-left" data-key="a" aria-label="左移">◀</button>
    <div class="dpad-btn dpad-mid"></div>
    <button class="dpad-btn dpad-right" data-key="d" aria-label="右移">▶</button>
    <button class="dpad-btn dpad-down" data-key="s" aria-label="后退">▼</button>
  </div>

  <!-- 拍照按钮 -->
  <button id="photoBtn" aria-label="拍照">📷</button>

  <!-- 设置按钮 -->
  <button id="settingsBtn" aria-label="设置">⚙</button>

  <!-- 设置面板 -->
  <div id="settingsPanel">
    <div class="sp-header">
      <span>设置</span>
      <button class="sp-close" id="settingsClose">×</button>
    </div>
    <div class="sp-item">
      <div class="sp-label"><span>渲染精度</span><span class="sp-value" id="renderScaleValue">250%</span></div>
      <input type="range" id="renderScaleSlider" min="1.5" max="3.0" step="0.05" value="2.5" />
    </div>
    <div class="sp-item">
      <div class="sp-label"><span>移动速度</span><span class="sp-value" id="moveSpeedValue">0.5</span></div>
      <input type="range" id="moveSpeedSlider" min="0.1" max="5.0" step="0.1" value="0.5" />
    </div>
    <div class="sp-item sp-toggle-row">
      <label class="sp-switch">
        <input type="checkbox" id="perfToggle" />
        <span class="sp-switch-slider"></span>
      </label>
      <span>性能监控</span>
    </div>
  </div>

  <!-- 性能监控面板 -->
  <div id="perfPanel"></div>

  <!-- 文字输入模态框 -->
  <div id="modal">
    <div class="card">
      <div class="prompt" id="photoPrompt">写下你想留在东明的话</div>
      <textarea id="photoInput" maxlength="30" placeholder=""></textarea>
      <div class="bg-section">
        <div class="bg-label">选择背景</div>
        <div class="bg-grid" id="bgGrid"></div>
      </div>
      <div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>
      <div class="btns">
        <button class="btn-save" id="btnSave">直接保存</button>
        <button class="btn-with" id="btnWith">加上这句话</button>
      </div>
    </div>
  </div>

  <!-- 加载错误 -->
  <div id="error">
    <div class="msg" id="errorMsg">校门暂时打不开，请稍后重试</div>
    <button id="refreshBtn">刷新重试</button>
  </div>

  <!-- WebGL 不支持 -->
  <div id="nowebgl">
    <div class="msg">你的浏览器不支持 WebGL，请使用 Chrome / Edge / Safari 打开</div>
  </div>

  <!-- 移动端分享降级：全屏大图 + 长按保存 -->
  <div id="shareView">
    <button class="close" id="shareClose">×</button>
    <img id="shareImg" alt="纪念照" />
    <div class="tip" id="shareTip">长按图片保存到相册</div>
  </div>

<script type="module">
/* =========================================================================
 * 东明学校数字校园 —— 3D 高斯泼溅纪念页
 *
 * 渲染库：gsplat.js（dylanebert/gsplat.js，npm: gsplat），全局 SPLAT 对象
 *   说明：技术文档中写作 "mkkellogg/gsplat.js"，但文档给出的全部 API 签名
 *        （SPLAT.Loader.LoadAsync / SPLAT.Scene / SPLAT.WebGLRenderer /
 *         SPLAT.OrbitControls / 全局 SPLAT）与 dylanebert/gsplat.js 完全一致，
 *        且该库不依赖 Three.js，符合 "禁止混入 Three.js API" 的强制约束。
 *
 * 八条强制约束落实位置见各处注释【约束N】。
 * ========================================================================= */

/* ----------------------------- 全局状态 -------------------------------- */
let config = null;          // 来自 config.json 的全部参数与文案
let SPLAT = null;           // gsplat.js 库（window.SPLAT）
let renderer = null;        // SPLAT.WebGLRenderer
let scene = null;           // SPLAT.Scene
let camera = null;          // SPLAT.Camera
const canvas = document.getElementById('canvas');

// 直接相机控制状态【约束7】不使用 OrbitControls，直接操作 camera.position / camera.rotation
// yaw/pitch 与 gsplat.js 的 Quaternion.FromEuler(pitch, yaw, 0) 配合：
//   yaw=0 → 相机看向 +Z（gsplat.js 的 Camera.forward 基准），yaw 增大 → 右转（顺时针）
//   pitch>0 → 看向下方（forward.y = -sin(pitch)），pitch<0 → 看向上方
let yaw = 0;
let pitch = 0;

// 检测 WebGL2 可用性（同时预创建带 preserveDrawingBuffer 的上下文）
function acquireWebGL2Context() {
  // 【约束4】preserveDrawingBuffer 只能在创建 WebGLRenderer 时设定一次，运行时不修改。
  // gsplat 的 WebGLRenderer 内部以 {antialias:false} 调用 getContext；为使截图可用，
  // 此处预先以 {antialias:false, preserveDrawingBuffer:true} 取得上下文，
  // 后续 WebGLRenderer 再次 getContext 将返回同一上下文（属性以首次创建为准）。
  const ctx = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  return ctx;
}

/* ----------------------- 1. 加载 gsplat.js 库 -------------------------- */
// 本地优先（libs/gsplat.js），失败回退 jsDelivr CDN，保证开箱即用与可本地化。
async function loadGSplat() {
  const attempts = [
    './libs/gsplat.js',                                                 // 本地（spec 文件结构）
    'https://cdn.jsdelivr.net/npm/gsplat@1.2.9/dist/index.es.js'        // CDN 回退
  ];
  let lastErr = null;
  for (const url of attempts) {
    try {
      const mod = await import(url);
      SPLAT = mod;
      window.SPLAT = SPLAT; // 暴露全局 SPLAT 对象【约束1】
      return;
    } catch (e) {
      lastErr = e;
      console.warn('[gsplat] 加载失败，尝试下一来源：', url, e);
    }
  }
  throw lastErr;
}

/* ----------------------- 4. 初始化 3D 环境 ----------------------------- */
// 【约束7】不使用 OrbitControls，直接操作 camera.position / camera.rotation。
// 用 yaw/pitch 两个欧拉角描述朝向，每帧通过 y.FromEuler 写入 camera.rotation。
function init3D() {
  // 【约束4】先取得带 preserveDrawingBuffer 的上下文（见 acquireWebGL2Context）
  const testCtx = acquireWebGL2Context();
  if (!testCtx) { showNoWebGL(); return false; }

  camera = new SPLAT.Camera();
  // gsplat.js 默认 far=100，对校园级大模型会被裁剪；放宽到 10000
  camera.data.near = 0.05;
  camera.data.far = 10000;
  // 传入 canvas：WebGLRenderer 复用上面已创建的上下文（preserveDrawingBuffer 生效）
  renderer = new SPLAT.WebGLRenderer(canvas);
  scene = new SPLAT.Scene();

  // 由 defaultView 的 position/target 反解初始 yaw/pitch（look 方向 = target - position）
  // gsplat.js 的 Camera.forward 基准方向是 +Z（即 yaw=0,pitch=0 时相机看向 +Z）
  // 经 Quaternion.FromEuler(pitch, yaw, 0) 旋转后：
  //   forward = (sin(yaw)*cos(pitch), -sin(pitch), cos(yaw)*cos(pitch))
  //   → sin(yaw) = fx, cos(yaw) = fz, -sin(pitch) = fy
  //   → yaw = atan2(fx, fz), pitch = -asin(fy)
  const dv = config.model.defaultView;
  const P = dv.position, T = dv.target;
  let fx = T.x - P.x, fy = T.y - P.y, fz = T.z - P.z;
  const fl = Math.max(1e-6, Math.sqrt(fx * fx + fy * fy + fz * fz));
  fx /= fl; fy /= fl; fz /= fl;
  yaw = Math.atan2(fx, fz);
  pitch = -Math.asin(clamp(fy, -1, 1));
  // 同步平滑值（初始化时直接对齐，无需插值）
  smoothYaw = yaw;
  smoothPitch = pitch;

  camera.position = new SPLAT.Vector3(P.x, P.y, P.z);
  applyCameraRotation();

  // 缓存初始视角，供 R 键复位使用
  defaultView = { x: P.x, y: P.y, z: P.z, yaw, pitch };
  // 重置速度
  velX = velY = velZ = 0;

  // 初始渲染缩放（性能兜底）
  renderScale = computeInitialScale();
  resize();
  return true;
}

// 将 smoothYaw/smoothPitch 写入 camera.rotation（平滑插值后的实际朝向）
function applyCameraRotation() {
  camera.rotation = SPLAT.Quaternion.FromEuler(new SPLAT.Vector3(smoothPitch, smoothYaw, 0));
}

// 重置视角到初始状态（R 键触发）
function resetView() {
  yaw = defaultView.yaw;
  pitch = defaultView.pitch;
  smoothYaw = yaw;
  smoothPitch = pitch;
  velX = velY = velZ = 0;
  camera.position = new SPLAT.Vector3(defaultView.x, defaultView.y, defaultView.z);
  applyCameraRotation();
}

// 自动检测并修正模型方向（确保 Y 轴朝上）
// 通过采样点云数据比较三轴范围，将最短的轴（通常是高度轴）旋转到 Y
function fixModelOrientation() {
  if (!scene || !scene.objects || scene.objects.length === 0) return;

  // 直接从点云数据采样计算原始包围盒（obj.bounds 可能不准确）
  let minX = Infinity, maxX = -Infinity;
  let minY = Infinity, maxY = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;
  for (const obj of scene.objects) {
    if (!obj.data || !obj.data.positions) continue;
    const pos = obj.data.positions;
    const vc = obj.data.vertexCount;
    const step = Math.max(1, Math.ceil(vc / 100000));
    for (let i = 0; i < vc; i += step) {
      const x = pos[3 * i], y = pos[3 * i + 1], z = pos[3 * i + 2];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  }
  const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
  console.log(`[fixOrientation] ranges: dx=${dx.toFixed(1)} dy=${dy.toFixed(1)} dz=${dz.toFixed(1)}`);

  // Y 应为最短轴（建筑高度通常小于长宽）；仅当 Y 显著大于最短轴时才旋转
  const minRange = Math.min(dx, dy, dz);
  if (dy <= minRange * 1.3) {
    // Y 已是最短轴，检查是否上下颠倒
    // 地面（地板）的点密度应高于屋顶，如果顶部点密度高于底部，说明模型倒了
    const yRange = maxY - minY;
    const bottomThreshold = minY + yRange * 0.3;
    const topThreshold = minY + yRange * 0.7;
    let bottomCount = 0, topCount = 0;
    for (const obj of scene.objects) {
      if (!obj.data || !obj.data.positions) continue;
      const pos = obj.data.positions;
      const vc = obj.data.vertexCount;
      const step = Math.max(1, Math.ceil(vc / 100000));
      for (let i = 0; i < vc; i += step) {
        const y = pos[3 * i + 1];
        if (y < bottomThreshold) bottomCount++;
        else if (y > topThreshold) topCount++;
      }
    }
    console.log(`[fixOrientation] density: bottom=${bottomCount} top=${topCount}`);

    if (topCount > bottomCount * 1.3) {
      // 顶部点密度高于底部，模型上下颠倒，绕 X 轴翻转 180°: (x,y,z)→(x,-y,-z)
      modelRotationType = 'flipY';
      const q = SPLAT.Quaternion.FromEuler(new SPLAT.Vector3(Math.PI, 0, 0));
      for (const obj of scene.objects) obj.rotation = q;
      console.log('[fixOrientation] 检测到模型上下颠倒，绕 X 轴翻转 180°');
    } else {
      modelRotationType = null;
      console.log('[fixOrientation] Y 已是最短轴，方向正确，无需旋转');
    }
    return;
  }

  if (dz <= dx) {
    // Z 最短 → Z 朝上 → 绕 X 轴旋转 -90°（Z→Y）
    modelRotationType = 'zToY';
    const q = SPLAT.Quaternion.FromEuler(new SPLAT.Vector3(-Math.PI / 2, 0, 0));
    for (const obj of scene.objects) obj.rotation = q;
    console.log('[fixOrientation] Z→Y：绕 X 轴旋转 -90°');
  } else {
    // X 最短 → X 朝上 → 绕 Z 轴旋转 +90°（X→Y）
    modelRotationType = 'xToY';
    const q = SPLAT.Quaternion.FromEuler(new SPLAT.Vector3(0, 0, Math.PI / 2));
    for (const obj of scene.objects) obj.rotation = q;
    console.log('[fixOrientation] X→Y：绕 Z 轴旋转 +90°');
  }
}

// 根据点云计算模型边界与地面高度
// gsplat.js 的 rotation 是延迟执行的，positions 在 render() 时才旋转
// 因此这里读取原始 positions 并手动应用旋转变换：
//   zToY:  (x,y,z) → (x, z, -y)   绕 X 轴 -90°
//   xToY:  (x,y,z) → (-y, x, z)   绕 Z 轴 +90°
//   flipY: (x,y,z) → (x, -y, -z)  绕 X 轴 180°（上下翻转）
//   null:  (x,y,z) → (x, y, z)    无旋转
// 地面高度采用旋转后 Y 坐标 15% 百分位
function computeModelBounds() {
  if (!scene || !scene.objects || scene.objects.length === 0) return null;

  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  let totalPoints = 0;
  const rotZ = modelRotationType === 'zToY';
  const rotX = modelRotationType === 'xToY';
  const flipY = modelRotationType === 'flipY';

  // 遍历原始点云，手动旋转后计算包围盒
  for (const obj of scene.objects) {
    if (!obj.data || !obj.data.positions) continue;
    const pos = obj.data.positions;
    const vc = obj.data.vertexCount;
    totalPoints += vc;
    const step = Math.max(1, Math.ceil(vc / 100000));
    for (let i = 0; i < vc; i += step) {
      const px = pos[3 * i], py = pos[3 * i + 1], pz = pos[3 * i + 2];
      // 手动应用旋转
      const rx = rotX ? -py : px;
      const ry = flipY ? -py : (rotZ ? pz : (rotX ? px : py));
      const rz = flipY ? -pz : (rotZ ? -py : pz);
      if (rx < minX) minX = rx; if (rx > maxX) maxX = rx;
      if (ry < minY) minY = ry; if (ry > maxY) maxY = ry;
      if (rz < minZ) minZ = rz; if (rz > maxZ) maxZ = rz;
    }
  }
  if (minX === Infinity || totalPoints === 0) return null;

  // 采样旋转后 Y 坐标用于地面检测
  const step = Math.max(1, Math.ceil(totalPoints / 500000));
  const ySamples = new Float32Array(Math.ceil(totalPoints / step));
  let si = 0;
  for (const obj of scene.objects) {
    if (!obj.data || !obj.data.positions) continue;
    const pos = obj.data.positions;
    const vc = obj.data.vertexCount;
    for (let i = 0; i < vc; i += step) {
      const py = pos[3 * i + 1], pz = pos[3 * i + 2], px = pos[3 * i];
      // 旋转后的 Y
      const ry = flipY ? -py : (rotZ ? pz : (rotX ? px : py));
      ySamples[si++] = ry;
    }
  }
  const yArr = ySamples.subarray(0, si);
  yArr.sort();
  const groundY = yArr[Math.floor(yArr.length * config.boundary.groundPercentile)];

  const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
  const longest = Math.max(dx, dy, dz);
  if (longest <= 0) return null;

  const gridSpacing = longest / 10;

  console.log(`[computeBounds] rot=${modelRotationType} size=(${dx.toFixed(1)},${dy.toFixed(1)},${dz.toFixed(1)}) groundY=${groundY.toFixed(2)} minY=${minY.toFixed(2)} maxY=${maxY.toFixed(2)} totalPoints=${totalPoints}`);

  return { minX, maxX, minY, maxY, minZ, maxZ, groundY, longest, gridSpacing, totalPoints };
}

// 空气墙：将相机位置限制在模型边界内
  // gsplat.js 渲染中 Y 向下，所以"上方"= 更小 Y，"下方/地面"= 更大 Y
  // 顶面（上限）= minY - 最长边×1.0（防止飞太高）
  // 底面（下限）= maxY（防止穿到地面以下）
  // 水平 = 包围盒 ± margin
  function clampCameraPosition() {
    if (!modelBounds || !config.boundary.enabled) return;
    const b = modelBounds;
    const margin = b.longest * config.boundary.marginMultiplier;
    // 上限（最高处）= minY - 最长边 × 1.0
    const yCeiling = b.minY - b.longest * 1.0;
    // 下限（地面）= maxY（模型底部）
    const yFloor = b.maxY;

    const pos = camera.position;
    const x = clamp(pos.x, b.minX - margin, b.maxX + margin);
    const y = clamp(pos.y, yCeiling, yFloor);
    const z = clamp(pos.z, b.minZ - margin, b.maxZ + margin);

    if (x !== pos.x || y !== pos.y || z !== pos.z) {
      camera.position = new SPLAT.Vector3(x, y, z);
    }
}

/* ----------------------- 底面网格渲染 ---------------------------- */
let gridCanvas = null, gridCtx = null;

// 初始化网格画布 2D 上下文
function initGridCanvas() {
  gridCanvas = $('gridCanvas');
  gridCtx = gridCanvas.getContext('2d');
}

// 使用 viewProj 矩阵将世界坐标投影到屏幕坐标
function projectPoint(wx, wy, wz) {
  const buf = camera.data.viewProj.buffer;
  const cx = wx * buf[0] + wy * buf[4] + wz * buf[8]  + buf[12];
  const cy = wx * buf[1] + wy * buf[5] + wz * buf[9]  + buf[13];
  const cz = wx * buf[2] + wy * buf[6] + wz * buf[10] + buf[14];
  const cw = wx * buf[3] + wy * buf[7] + wz * buf[11] + buf[15];
  if (cw <= 0.01) return null; // 在相机背后
  return {
    x: (cx / cw + 1) * gridCanvas.width  * 0.5,
    y: (1 - cy / cw) * gridCanvas.height * 0.5,
    d: cw // 深度（用于距离衰减）
  };
}

// 绘制无限延伸的底面网格
// 网格始终以相机 XZ 为中心，向四周延伸 extent 距离，远处淡出
function drawGrid() {
  if (!modelBounds || !config.boundary.grid || !gridCtx) return;
  const ctx = gridCtx;
  const w = gridCanvas.width, h = gridCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const gy = modelBounds.groundY;
  const sp = modelBounds.gridSpacing;
  const ext = modelBounds.longest * 2;          // 网格延伸范围
  const cp = camera.position;
  // 对齐到网格：相机所在的网格交点
  const ox = Math.round(cp.x / sp) * sp;
  const oz = Math.round(cp.z / sp) * sp;
  const n = Math.ceil(ext / sp);

  const baseA = config.boundary.gridOpacity;
  const [cr, cg, cb] = config.boundary.gridColor;

  // 按 alpha 分 6 层批量绘制，减少 stroke 调用
  const levels = 6;
  const batches = Array.from({ length: levels }, () => []);

  // 收集所有可见线段
  for (let i = -n; i <= n; i++) {
    const pos = ox + i * sp;
    const isMajor = i % 5 === 0;
    const a = baseA * (isMajor ? 1.6 : 1.0);

    // Z 方向延伸的线（固定 X = pos）
    let prev = projectPoint(pos, gy, oz - n * sp);
    for (let j = -n + 1; j <= n; j++) {
      const cur = projectPoint(pos, gy, oz + j * sp);
      if (prev && cur) {
        const dist = (prev.d + cur.d) * 0.5;
        const fade = Math.max(0, 1 - dist / ext);
        const alpha = Math.min(1, fade * a);
        if (alpha > 0.01) {
          const lv = Math.min(levels - 1, Math.floor(alpha * levels));
          batches[lv].push(prev.x, prev.y, cur.x, cur.y);
        }
      }
      prev = cur;
    }

    // X 方向延伸的线（固定 Z = pos）
    prev = projectPoint(ox - n * sp, gy, pos);
    for (let j = -n + 1; j <= n; j++) {
      const cur = projectPoint(ox + j * sp, gy, pos);
      if (prev && cur) {
        const dist = (prev.d + cur.d) * 0.5;
        const fade = Math.max(0, 1 - dist / ext);
        const alpha = Math.min(1, fade * a);
        if (alpha > 0.01) {
          const lv = Math.min(levels - 1, Math.floor(alpha * levels));
          batches[lv].push(prev.x, prev.y, cur.x, cur.y);
        }
      }
      prev = cur;
    }
  }

  // 批量绘制
  ctx.lineWidth = 1;
  for (let i = 0; i < levels; i++) {
    const arr = batches[i];
    if (arr.length === 0) continue;
    const alpha = (i + 0.5) / levels;
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.beginPath();
    for (let j = 0; j < arr.length; j += 4) {
      ctx.moveTo(arr[j], arr[j + 1]);
      ctx.lineTo(arr[j + 2], arr[j + 3]);
    }
    ctx.stroke();
  }
}

// 自动取景：初始位置设为点云中心，地面眼高，水平视角
function autoFrameModel() {
  fixModelOrientation();
  modelBounds = computeModelBounds();
  if (!modelBounds) return;

  const b = modelBounds;
  const cx = (b.minX + b.maxX) / 2;
  const cz = (b.minZ + b.maxZ) / 2;
  const longest = b.longest;

  // 初始位置 = 模型上方斜后方，俯瞰全景
  // 注意：gsplat.js 渲染中 Y 轴向下，所以"上方"= 更小的 Y 值（minY 方向）
  const modelHeight = b.maxY - b.groundY;
  const camX = cx;
  const camY = b.minY - longest * 0.8; // 向上 = minY 方向（渲染中 Y 向下）
  const camZ = cz - longest * 0.5;     // 向前 = 靠近模型
  camera.position = new SPLAT.Vector3(camX, camY, camZ);
  // 朝向模型中心（略微俯视）
  const tx = cx, ty = b.groundY + modelHeight * 0.3, tz = cz;
  const fx = tx - camX, fy = ty - camY, fz = tz - camZ;
  const fl = Math.max(1e-6, Math.sqrt(fx * fx + fy * fy + fz * fz));
  yaw = Math.atan2(fx / fl, fz / fl);
  pitch = -Math.asin(clamp(fy / fl, -1, 1));
  smoothYaw = yaw;
  smoothPitch = pitch;
  applyCameraRotation();
  // 更新默认视角缓存（R 键复位到此位置）
  defaultView = { x: camX, y: camY, z: camZ, yaw, pitch };
  velX = velY = velZ = 0;
  // 根据模型尺寸自适应移动速度
  const speedScale = Math.max(1, longest / 50);
  config.controls.moveSpeed = clamp(config.controls.moveSpeed * speedScale, config.controls.moveSpeedMin, config.controls.moveSpeedMax);
  config.controls.elevationSpeed = Math.max(config.controls.elevationSpeed, 5.0 * speedScale);
  console.log('[autoFrame] center=(' + cx + ',' + cz + ') groundY=' + b.groundY.toFixed(2) + ' cam=(' + camX + ',' + camY + ',' + camZ + ') moveSpeed=' + config.controls.moveSpeed.toFixed(1));
}

// 初始渲染缩放评估：硬件并发数 / 屏幕 / 是否移动设备
function computeInitialScale() {
  const cfg = config.render.initialScale;
  if (typeof cfg === 'number') return clamp(cfg, config.render.userScaleMin, config.render.userScaleMax);
  const cores = navigator.hardwareConcurrency || 4;
  const pixels = window.screen.width * window.screen.height * (window.devicePixelRatio || 1);
  // 默认使用用户配置的渲染精度
  let s = config.render.userScaleDefault;
  // 移动端 / 低核心数设备适当降低初始精度
  if (isMobile) s = Math.min(s, cores >= 6 ? 1.3 : 1.2);
  else s = cores >= 8 ? Math.min(s, 1.5) : Math.min(s, 1.3);
  if (pixels > 2073600 * 2) s = Math.min(s, 1.3); // 超高分辨率屏再降一档
  return clamp(s, config.render.userScaleMin, config.render.userScaleMax);
}

/* -------------------------- 5. 模型加载（主/备）------------------------ */
// 【约束6】多 URL 轮询加载，失败切换下一个 URL，必须重新实例 Scene，避免模型重叠。
async function loadModelWithFallback() {
  const urls = config.model.urls || [];
  for (let i = 0; i < urls.length; i++) {
    try {
      console.log('[model] 尝试 URL[' + i + ']:', urls[i]);
      await loadModelOnce(urls[i], i === 0);
      return true;
    } catch (e) {
      console.warn('[model] URL[' + i + '] 失败：', e);
      if (i < urls.length - 1) {
        // 清空当前场景残留：重新实例 Scene（约束2：不调用 scene.reset，直接 new）
        scene = new SPLAT.Scene();
      } else {
        console.error('[model] 所有 URL 均失败');
        showError();
        return false;
      }
    }
  }
  return false;
}

// 单次加载，带超时与进度回调
// 使用 XMLHttpRequest 替代 fetch()，避免 Electron 环境中大文件 fetch 被中止 (ERR_ABORTED)
function loadModelOnce(url, isPrimary) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'arraybuffer';

    xhr.onprogress = (e) => {
      if (e.lengthComputable) {
        const p = Math.max(0, Math.min(1, e.loaded / e.total));
        $('progressBar').style.width = (p * 100).toFixed(1) + '%';
        $('progressPct').textContent = Math.floor(p * 100) + '%';
      }
    };

    xhr.onload = () => {
      if (settled) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          // LoadFromArrayBuffer 是同步函数，直接调用，不包 Promise
          SPLAT.Loader.LoadFromArrayBuffer(xhr.response, scene);
          settled = true;
          clearTimeout(timer);
          $('progressBar').style.width = '100%';
          $('progressPct').textContent = '100%';
          resolve();
        } catch (e) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(e);
        }
      } else {
        settled = true;
        clearTimeout(timer);
        reject(new Error('HTTP ' + xhr.status + ' ' + xhr.statusText));
      }
    };

    xhr.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(new Error('网络请求失败'));
    };

    xhr.onabort = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(new Error('请求已取消'));
    };

    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      xhr.abort();
      reject(new Error('加载超时 ' + config.load.timeout + 'ms'));
    }, config.load.timeout);

    xhr.send();
  });
}

/* ----------------------------- 6. 渲染循环 ----------------------------- */
function startRenderLoop() {
  // 取消已有渲染循环，防止 HMR/重复初始化导致多个 RAF 循环并行
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  lastFrameTime = performance.now();
  fpsLast = lastFrameTime;
  fpsFrames = 0;
  const loop = (now) => {
    rafId = requestAnimationFrame(loop);
    let dt = (now - lastFrameTime) / 1000;
    if (dt > 0.1) dt = 0.1; // 防止切后台回来时跳变
    frameTimeMs = dt * 1000; // 供性能面板读取瞬时帧耗时
    lastFrameTime = now;

    const moved = applyMovement(dt);  // 自由飞行移动（WASD / 摇杆 / Q/E 升降，速度平滑）
    // 视角平滑插值：让旋转跟手流畅，避免抖动（高 lerp 系数 = 快速跟随）
    const lookLerp = 1 - Math.exp(-config.controls.lookSmooth * dt);
    smoothYaw += (yaw - smoothYaw) * lookLerp;
    smoothPitch += (pitch - smoothPitch) * lookLerp;
    applyCameraRotation(); // 将 smoothYaw/smoothPitch 写入 camera.rotation

    // ---- 动态分辨率：运动时降精度保 FPS，停止后恢复高精度并提示 ----
    const lookDelta = Math.abs(yaw - smoothYaw) + Math.abs(pitch - smoothPitch);
    const lookSettling = lookDelta > 0.003;
    const currentlyMoving = moved || lookSettling;
    if (currentlyMoving && !isMoving) {
      // 进入运动状态：降低渲染精度
      isMoving = true;
      renderScale = config.render.motionScale;
      resize();
    } else if (!currentlyMoving && isMoving) {
      // 运动停止：恢复用户设定精度，提示
      isMoving = false;
      renderScale = userRenderScale;
      resize();
      showHint(config.ui.qualityHintText);
    }

    renderer.render(scene, camera);

    // 空气墙约束：每帧检查相机位置是否越界（约束：每帧应用 Y 轴高度限制）
    clampCameraPosition();

    // 底面网格绘制（在 renderer.render 之后，viewProj 矩阵已更新）
    drawGrid();

    // FPS 统计（仅监控，不再自动降级——渲染精度完全由用户手动控制）
    fpsFrames++;
    if (now - fpsLast >= config.render.fpsCheckInterval) {
      fpsAvg = (fpsFrames * 1000) / (now - fpsLast);
      fpsFrames = 0; fpsLast = now;
    }
  };
  rafId = requestAnimationFrame(loop);
}

/* --------------------------- 7. 自由移动逻辑（飞行模式 + 速度平滑）------- */
// 飞行模式：W/S 沿视线方向（含 pitch 俯仰分量），A/D 水平横移，Q/E 世界垂直升降。
// 使用加速度/减速度模型让起步和停止更跟手：有输入时快速加速到目标速度，松开时平滑减速至零。
function applyMovement(dt) {
  // 前向（含 pitch）、右向（纯水平），gsplat.js 约定：yaw=0 → +Z, pitch>0 → 朝下
  const cp = Math.cos(pitch);
  const fx = Math.sin(yaw) * cp;     // 前向 X
  const fy = -Math.sin(pitch);       // 前向 Y（pitch>0 → fy<0 → 朝下）
  const fz = Math.cos(yaw) * cp;     // 前向 Z
  const rx = Math.cos(yaw);          // 右向 X
  const rz = -Math.sin(yaw);         // 右向 Z

  // 桌面输入
  let inF = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  let inR = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  let inU = (keys.e ? 1 : 0) - (keys.q ? 1 : 0); // Y轴向下：E=下降(+Y)，Q=上升(-Y)
  let speed = config.controls.moveSpeed;

  // 移动端摇杆输入（速度与偏移距离成正比，有上限）
  if (joystick.active && joystick.mag > 0.05) {
    inF = joystick.dy;          // 上推 = 前向
    inR = joystick.dx;
    const m = Math.sqrt(inF * inF + inR * inR);
    if (m > 1) { inF /= m; inR /= m; }
    speed = config.controls.joystickMaxSpeed * Math.min(joystick.mag, 1);
  } else {
    const m = Math.sqrt(inF * inF + inR * inR);
    if (m > 1) { inF /= m; inR /= m; }
  }

  // 目标速度向量（飞行模式：前向含 pitch 分量）
  const elevSpd = Math.max(config.controls.elevationSpeed, speed);
  const tvx = (fx * inF + rx * inR) * speed;
  const tvy = fy * inF * speed + inU * elevSpd;
  const tvz = (fz * inF + rz * inR) * speed;

  // 加速度/减速度：有输入时快速趋近目标速度，无输入时减速至零
  const hasInput = (inF !== 0 || inR !== 0 || inU !== 0);
  const rate = hasInput ? config.controls.moveAccel : config.controls.moveDecel;
  const lerp = 1 - Math.exp(-rate * dt);
  velX += (tvx - velX) * lerp;
  velY += (tvy - velY) * lerp;
  velZ += (tvz - velZ) * lerp;

  // 极小速度归零，避免浮点漂移
  if (Math.abs(velX) < 1e-4) velX = 0;
  if (Math.abs(velY) < 1e-4) velY = 0;
  if (Math.abs(velZ) < 1e-4) velZ = 0;

  // 应用位移（空气墙约束在渲染循环中每帧执行 clampCameraPosition）
  if (velX !== 0 || velY !== 0 || velZ !== 0) {
    const pos = camera.position;
    camera.position = new SPLAT.Vector3(pos.x + velX * dt, pos.y + velY * dt, pos.z + velZ * dt);
    return true;
  }
  return false;
}

/* ----------------------- 9. 尺寸 / 横竖屏自适应 ----------------------- */
// gsplat.js 默认 fx=fy=1132，投影矩阵中 FOV ∝ fx/width。
// 当 renderScale 改变 canvas 绘制缓冲尺寸时，需同步缩放 fx/fy 保持 FOV 不变。
const BASE_FX = 1132, BASE_FY = 1132;
function resize() {
  if (!renderer) return;
  const dpr = Math.min(window.devicePixelRatio || 1, config.photo.maxDPR);
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(
    Math.max(1, Math.floor(w * dpr * renderScale)),
    Math.max(1, Math.floor(h * dpr * renderScale))
  );
  // 网格画布与 WebGL 画布同分辨率（renderScale 下保持清晰）
  if (gridCanvas) {
    gridCanvas.width = Math.max(1, Math.floor(w * dpr * renderScale));
    gridCanvas.height = Math.max(1, Math.floor(h * dpr * renderScale));
  }
  // 补偿 renderScale 对焦距的影响：fx/fy 同步缩放，FOV 保持恒定
  if (camera && camera.data) {
    camera.data.fx = BASE_FX * renderScale;
    camera.data.fy = BASE_FY * renderScale;
  }
  isPortrait = window.innerHeight >= window.innerWidth;
}
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    // 切换横竖屏时保持当前相机视角不变（不做任何相机重置）
  }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

/* ----------------------- 11. 桌面键盘（WASD / Q/E / R）---------------- */
// 【约束】所有键盘事件 preventDefault，避免触发浏览器默认行为。
const KEY_CODES = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyR']);
window.addEventListener('keydown', (e) => {
  if (modalOpen) return;
  if (e.code === 'KeyR') {
    e.preventDefault();
    resetView();
    return;
  }
  if (KEY_CODES.has(e.code)) {
    e.preventDefault();
    const k = e.code.toLowerCase().slice(-1);
    keys[k] = true;
  }
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (KEY_CODES.has(e.code) && e.code !== 'KeyR') {
    e.preventDefault();
    const k = e.code.toLowerCase().slice(-1);
    keys[k] = false;
  }
}, { passive: false });

/* ----------------------- 12. 移动端方向键 D-Pad ------------------------ */
// D-Pad：4 个方向按钮，直接操作 keys 对象（与键盘共用同一套移动逻辑）。
// 支持多指同时按下（如左上对角移动），松手即停。
function setupJoystick() {
  if (!isTouchDevice) return;
  const dpad = $('dpad');
  dpad.classList.add('active');
  // joystick 标记为非摇杆模式，applyMovement 走键盘 keys 分支
  joystick.active = false;

  const btns = dpad.querySelectorAll('.dpad-btn[data-key]');
  btns.forEach((btn) => {
    const k = btn.dataset.key;
    const press = (e) => {
      e.preventDefault();
      keys[k] = true;
      btn.classList.add('pressed');
    };
    const release = (e) => {
      e.preventDefault();
      keys[k] = false;
      btn.classList.remove('pressed');
    };
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('touchcancel', release, { passive: false });
  });
}

/* --------------- 12b. 视角控制（桌面拖动旋转 / 移动端触摸）-------------- */
// 桌面（键鼠）：按住鼠标左键拖动旋转视角，松开停止。不再使用 Pointer Lock。
// 移动端（触屏）：单指拖动旋转，双指上下升降。
function setupLookControls() {
  const keysHelp = $('keysHelp');

  // --------- 桌面（键鼠）分支：拖动旋转 ---------
  if (!isTouchDevice) {
    keysHelp.classList.add('show');

    // 鼠标拖动状态
    let mouseDragging = false;
    let lastMX = 0, lastMY = 0;

    canvas.addEventListener('mousedown', (e) => {
      if (modalOpen) return;
      if (e.button !== 0) return; // 仅左键
      mouseDragging = true;
      lastMX = e.clientX;
      lastMY = e.clientY;
      canvas.focus();
    });

    document.addEventListener('mousemove', (e) => {
      if (!mouseDragging || modalOpen) return;
      const s = config.controls.dragLookSensitivity;
      const dx = e.clientX - lastMX;
      const dy = e.clientY - lastMY;
      // 右拖 → 右转（yaw 增大），下拖 → 看下方（pitch 增大），无俯仰限制
      yaw += dx * s;
      pitch += dy * s;
      lastMX = e.clientX;
      lastMY = e.clientY;
    });

    const endMouseDrag = () => { mouseDragging = false; };
    document.addEventListener('mouseup', endMouseDrag);
    document.addEventListener('mouseleave', endMouseDrag);

    setupLookControls._touchMode = false;
    return;
  }

  // ---------- 移动端（触屏）分支：单指旋转 + 双指升降 ----------
  setupLookControls._touchMode = true;

  // 触屏设备隐藏桌面按键提示（D-Pad 由 setupJoystick 单独控制）
  keysHelp.classList.remove('show');

  // 使用 targetTouches：仅追踪落在 canvas 上的手指，避免与摇杆手指混淆。
  const dist2 = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const midY = (a, b) => (a.clientY + b.clientY) / 2;

  canvas.addEventListener('touchstart', (e) => {
    if (modalOpen) return;
    e.preventDefault();
    const tt = e.targetTouches;
    if (tt.length === 1) {
      look.dragging = true;
      look.lastX = tt[0].clientX;
      look.lastY = tt[0].clientY;
      pinch.active = false;
    } else if (tt.length === 2) {
      look.dragging = false;
      pinch.active = true;
      pinch.lastDist = dist2(tt[0], tt[1]);
      pinch.lastMidY = midY(tt[0], tt[1]);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (modalOpen) return;
    e.preventDefault();
    const tt = e.targetTouches;
    if (tt.length === 1 && look.dragging) {
      // 单指拖动：旋转视角（与拖动方向一致，无俯仰限制）
      const s = config.controls.touchLookSensitivity;
      const dx = tt[0].clientX - look.lastX;
      const dy = tt[0].clientY - look.lastY;
      yaw += dx * s;
      pitch += dy * s;
      look.lastX = tt[0].clientX;
      look.lastY = tt[0].clientY;
    } else if (tt.length === 2 && pinch.active) {
      // 双指上下滑动：升降相机 Y（Y轴向下，上滑=减小Y=升高）
      const curMidY = midY(tt[0], tt[1]);
      const dy = pinch.lastMidY - curMidY; // 上滑为正
      const speed = config.controls.elevationSpeed * 0.05;
      const newY = camera.position.y - dy * speed; // Y向下：上滑减Y=升高
      camera.position = new SPLAT.Vector3(camera.position.x, newY, camera.position.z);
      pinch.lastMidY = curMidY;
      pinch.lastDist = dist2(tt[0], tt[1]);
    }
  }, { passive: false });

  const endTouch = (e) => {
    const tt = e.targetTouches;
    if (tt.length === 0) {
      look.dragging = false;
      pinch.active = false;
    } else if (tt.length === 1) {
      pinch.active = false;
      look.dragging = true;
      look.lastX = tt[0].clientX;
      look.lastY = tt[0].clientY;
    }
  };
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
}

/* ----------------- 13. 全局 touchmove {passive:false} ------------------ */
// 【约束5】全局 touchmove 必须显式声明 {passive:false}。
// 非模态状态下阻止默认页面滚动与双指缩放；模态框打开时放行，保证输入框可用。
function setupGlobalTouchGuard() {
  const handler = (e) => {
    if (modalOpen) return;             // 模态框内允许默认行为（输入/滚动）
    e.preventDefault();                 // 阻止页面滚动与双指缩放
  };
  document.addEventListener('touchmove', handler, { passive: false });
  // 阻止双击放大与多点手势
  document.addEventListener('gesturestart', (e) => { if (!modalOpen) e.preventDefault(); }, { passive: false });
  // 阻止右键菜单（部分长按触发）
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ----------------------- 12c. 设置面板（渲染精度 / 移动速度）------------- */
function setupSettings() {
  const panel = $('settingsPanel');
  const btn = $('settingsBtn');
  const closeBtn = $('settingsClose');
  const rsSlider = $('renderScaleSlider');
  const rsValue = $('renderScaleValue');
  const msSlider = $('moveSpeedSlider');
  const msValue = $('moveSpeedValue');

  // 从 config 读取滑块范围与默认值
  const r = config.render;
  rsSlider.min = r.userScaleMin;
  rsSlider.max = r.userScaleMax;
  rsSlider.step = r.userScaleStep;
  rsSlider.value = r.userScaleDefault;

  const c = config.controls;
  msSlider.min = c.moveSpeedMin;
  msSlider.max = c.moveSpeedMax;
  msSlider.step = c.moveSpeedStep;
  msSlider.value = c.moveSpeed;

  // 初始显示值
  rsValue.textContent = Math.round(r.userScaleDefault * 100) + '%';
  msValue.textContent = parseFloat(c.moveSpeed).toFixed(1);

  // 将运行时 renderScale 与 userRenderScale 同步为滑块默认值
  renderScale = r.userScaleDefault;
  userRenderScale = r.userScaleDefault;
  resize();

  // 渲染精度滑块：实时调整 renderScale 并 resize
  rsSlider.addEventListener('input', () => {
    const v = parseFloat(rsSlider.value);
    renderScale = v;
    userRenderScale = v;
    rsValue.textContent = Math.round(v * 100) + '%';
    resize();
  });

  // 移动速度滑块：实时修改 config.controls.moveSpeed
  msSlider.addEventListener('input', () => {
    const v = parseFloat(msSlider.value);
    config.controls.moveSpeed = v;
    msValue.textContent = v.toFixed(1);
  });

  // 开关面板
  const togglePanel = (open) => {
    panel.classList.toggle('open', open);
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePanel(!panel.classList.contains('open'));
  });
  closeBtn.addEventListener('click', () => togglePanel(false));
  // 点击面板外部关闭
  document.addEventListener('click', (e) => {
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
      togglePanel(false);
    }
  });

  // 性能监控开关
  const perfToggle = $('perfToggle');
  perfToggle.addEventListener('change', () => {
    perfPanelVisible = perfToggle.checked;
    $('perfPanel').classList.toggle('show', perfPanelVisible);
    if (perfPanelVisible) {
      updatePerfDisplay();
    } else {
      clearTimeout(perfUpdateTimer);
    }
  });
}

/* ----------------------- 13b. 性能监控面板 ---------------------------- */
// 查询 GPU 信息：渲染器名称 + VRAM（仅 NVIDIA 桌面端支持 NVX_gpu_memory_info 扩展）
function queryGpuInfo() {
  if (!renderer || !renderer.gl) return null;
  const gl = renderer.gl;
  const info = { renderer: '未知', totalVram: 0, hasVramExt: false };

  // GPU 名称（WEBGL_debug_renderer_info）
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  if (dbg) {
    const name = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    if (name) info.renderer = name;
  }

  // VRAM（NVX_gpu_memory_info，仅 NVIDIA 桌面端 Chrome 支持）
  const memExt = gl.getExtension('NVX_gpu_memory_info') || gl.getExtension('EXT_memory_info');
  if (memExt) {
    info.hasVramExt = true;
    try {
      const total = gl.getParameter(memExt.GPU_MEMORY_INFO_DEDICATED_VIDMEM_NVX);
      if (typeof total === 'number' && total > 0) info.totalVram = total;
    } catch (e) { /* 忽略 */ }
  }
  return info;
}

// 估算 GPU 显存占用（无扩展时的回退方案）
// gsplat.js 将 splat 数据上传为多个 GPU buffer / texture，每点约 80 字节
function estimateVramUsage() {
  let splatCount = 0;
  if (renderer && renderer.renderProgram && renderer.renderProgram.renderData) {
    splatCount = renderer.renderProgram.renderData.vertexCount || 0;
  }
  // splat 数据（positions + rotations + scales + data texture + depth index + transform indices）
  const splatBytes = splatCount * 80;
  // 帧缓冲（color RGBA + depth）
  const fbBytes = canvas.width * canvas.height * 8;
  return { splatCount, splatBytes, fbBytes, total: splatBytes + fbBytes };
}

// 读取真实 VRAM 占用（仅 hasVramExt 时可用）
function readVramUsage() {
  if (!perfGpuInfo || !perfGpuInfo.hasVramExt || !renderer || !renderer.gl) return null;
  const gl = renderer.gl;
  const memExt = gl.getExtension('NVX_gpu_memory_info') || gl.getExtension('EXT_memory_info');
  if (!memExt) return null;
  try {
    const avail = gl.getParameter(memExt.GPU_MEMORY_INFO_CURRENT_AVAILABLE_VIDMEM_NVX);
    if (typeof avail !== 'number') return null;
    const total = perfGpuInfo.totalVram;
    const used = total - avail;
    return { total, used, avail };
  } catch (e) { return null; }
}

// 更新性能面板显示（每 500ms 调用一次）
let perfUpdateTimer = null;
function updatePerfDisplay() {
  if (!perfPanelVisible) return;
  const panel = $('perfPanel');

  // 瞬时 FPS（由 frameTimeMs 反算）与平均 FPS
  const instFps = frameTimeMs > 0 ? 1000 / frameTimeMs : 0;
  const avgFps = fpsAvg;
  const fpsClass = avgFps >= 50 ? 'pf-fps-good' : avgFps >= 30 ? 'pf-fps-ok' : 'pf-fps-bad';

  // 渲染分辨率
  const rw = canvas.width, rh = canvas.height;

  // 显存信息
  let vramLine = '';
  const realVram = readVramUsage();
  if (realVram) {
    const usedMB = (realVram.used / 1024 / 1024).toFixed(0);
    const totalMB = (realVram.total / 1024 / 1024).toFixed(0);
    vramLine = `显存  ${usedMB} / ${totalMB} MB`;
  } else {
    const est = estimateVramUsage();
    const estMB = (est.total / 1024 / 1024).toFixed(0);
    vramLine = `显存  ≈${estMB} MB (估算)`;
  }

  // GPU 名称（仅首次查询后缓存显示）
  const gpuName = perfGpuInfo ? perfGpuInfo.renderer : '未知';

  panel.innerHTML =
    `FPS   <span class="${fpsClass}">${avgFps.toFixed(0)}</span>  (${instFps.toFixed(0)})\n` +
    `帧时  ${frameTimeMs.toFixed(1)} ms\n` +
    `分辨率 ${rw}×${rh}\n` +
    vramLine + '\n' +
    `GPU   ${gpuName}`;

  // 安排下一次更新
  perfUpdateTimer = setTimeout(updatePerfDisplay, 500);
}

// 初始化性能监控（查询 GPU 信息，在面板打开后启动定时更新）
function setupPerfMonitor() {
  perfGpuInfo = queryGpuInfo();
}

/* -------------------------- 14. 拍照与文字合成 ------------------------- */
// 【约束4】截图依赖初始化时设定的 preserveDrawingBuffer:true，运行时不修改。
// 先渲染一帧保证最新，再以 canvas.toDataURL 取得纯净画面（不含任何 UI 元素）。
function captureSceneDataUrl() {
  if (renderer && scene && camera) renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
}

// 在离屏 canvas 上合成：截图 + 背景 + 水印 + 自定义文字（自动换行）
function composePhoto(userText) {
  // 取得纯净场景截图（同步可用，因 preserveDrawingBuffer 已开启），同时刷新最新帧
  captureSceneDataUrl();
  const off = document.createElement('canvas');
  // 分辨率与当前渲染分辨率一致；DPR 上限由 config 限制，防文件过大
  off.width = canvas.width;
  off.height = canvas.height;
  const ctx = off.getContext('2d');
  // 将 3D 画布绘制到离屏画布（preserveDrawingBuffer 保证可读）
  ctx.drawImage(canvas, 0, 0, off.width, off.height);
  // 如有选中背景，绘制在 3D 场景之后（仅填充透明区域）
  if (selectedBg) {
    const bgImg = getBgImage(selectedBg);
    if (bgImg) {
      ctx.globalCompositeOperation = 'destination-over';
      drawCover(ctx, bgImg, 0, 0, off.width, off.height);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  drawComposition(ctx, off.width, off.height, isPortrait, userText);
  return off;
}

// cover 模式绘制图片（保持比例填满区域，居中裁剪）
function drawCover(ctx, img, x, y, w, h) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return;
  const scale = Math.max(w / iw, h / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
}

// 文字层绘制（横竖屏分别排版）
function drawComposition(ctx, W, H, portrait, userText) {
  const watermark = config.page.watermark;
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = Math.max(2, Math.round(W * 0.012));
  ctx.textBaseline = 'top';

  if (portrait) {
    // 竖屏：水印顶部居中（字号约画宽 5%），自定义文字底部居中（约 8%）
    const wmSize = Math.round(W * config.photo.portraitWatermarkRatio);
    const txSize = Math.round(W * config.photo.portraitTextRatio);
    ctx.font = `600 ${wmSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(watermark, W / 2, Math.round(H * 0.04));
    if (userText && userText.trim()) {
      ctx.font = `500 ${txSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      drawWrappedText(ctx, userText, W / 2, H - Math.round(H * 0.12), W * config.photo.wrapWidthRatio, txSize * 1.4, 'center');
    }
  } else {
    // 横屏：水印左下角（约 4%），自定义文字右下角（约 6%）
    const wmSize = Math.round(H * config.photo.landscapeWatermarkRatio);
    const txSize = Math.round(H * config.photo.landscapeTextRatio);
    const pad = Math.round(W * 0.03);
    ctx.font = `600 ${wmSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(watermark, pad, H - pad - wmSize);
    if (userText && userText.trim()) {
      ctx.font = `500 ${txSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
      drawWrappedText(ctx, userText, W - pad, H - pad - txSize, W * config.photo.wrapWidthRatio, txSize * 1.4, 'right');
    }
  }
  ctx.restore();
}

// Canvas 手动测量换行：超过 30 字或超出画布宽度 80% 时换行
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, align) {
  text = (text || '').slice(0, config.photo.maxChars);
  ctx.textAlign = align;
  // 按字符逐个测量（兼容中英文混排）
  const lines = [];
  let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  // 从底部向上绘制（右下/底部居中）
  const totalH = lines.length * lineHeight;
  let startY = y - totalH + lineHeight;
  for (const ln of lines) {
    ctx.fillText(ln, x, startY);
    startY += lineHeight;
  }
}

// 模态框实时预览（降采样绘制以节省性能）
function updatePreview() {
  const pc = $('previewCanvas');
  const W = Math.min(360, window.innerWidth - 80);
  const ratio = canvas.height ? canvas.height / canvas.width : 0.5625;
  const H = Math.round(W * ratio);
  pc.width = W; pc.height = H;
  const ctx = pc.getContext('2d');
  ctx.drawImage(canvas, 0, 0, W, H);
  // 预览中也应用选中背景
  if (selectedBg) {
    const bgImg = getBgImage(selectedBg);
    if (bgImg) {
      ctx.globalCompositeOperation = 'destination-over';
      drawCover(ctx, bgImg, 0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  drawComposition(ctx, W, H, isPortrait, $('photoInput').value);
}

/* ----------------------------- 15. 导出 / 分享 ------------------------ */
async function exportPhoto(userText) {
  const composed = composePhoto(userText);
  const dataUrl = composed.toDataURL('image/png');
  const filename = `dongming_2026_${Date.now()}.png`;

  // 移动端：优先 Web Share API；微信/QQ 内置浏览器降级为长按保存
  if (isMobile) {
    try {
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], filename, { type: 'image/png' });
      if (!isWeChatOrQQ && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) {
      console.warn('[share] 调起分享失败，降级为长按保存', e);
    }
    // 降级：全屏大图 + 长按保存提示
    $('shareImg').src = dataUrl;
    $('shareView').classList.add('show');
  } else {
    // 桌面端：触发浏览器下载
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}

/* --------------------------- 16. 模态框开关 --------------------------- */
function openModal() {
  modalOpen = true;                       // 跳过触摸阻止逻辑，保证输入框可用
  $('modal').classList.add('open');
  setTimeout(updatePreview, 30);
  $('photoInput').focus({ preventScroll: true });
}
function closeModal() {
  modalOpen = false;
  $('modal').classList.remove('open');
  $('photoInput').value = '';
}

/* ----------------------------- 17. UI 提示 ---------------------------- */
function showHint(text) {
  const hint = $('hint');
  if (text !== undefined) hint.textContent = text;
  hint.classList.add('show');
  setTimeout(() => {
    hint.classList.remove('show');
    // 恢复默认操作提示文案
    if (text !== undefined) hint.textContent = isMobile ? config.ui.hintMobile : config.ui.hintDesktop;
  }, config.ui.operateHintDuration);
}
function showNoWebGL() { $('nowebgl').classList.add('show'); }
function showError() { $('error').classList.add('show'); }

/* --------------------------- 18. 预留扩展接口 ------------------------- */
// 允许外部动态合并配置并即时生效（如视角灵敏度、文案等）。
window.updateConfig = function (newConfig) {
  if (!newConfig || typeof newConfig !== 'object') return;
  config = deepMerge(config, newConfig);
  applyTexts();
  resize();
};
function deepMerge(a, b) {
  const out = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) {
      out[k] = deepMerge(a[k] || {}, b[k]);
    } else {
      out[k] = b[k];
    }
  }
  return out;
}

/* ------------------------------- 19. 启动 ----------------------------- */
async function main() {
  // 防止 HMR 或 Vite 注入导致 main() 被多次执行（多个渲染循环并行 → 黑屏 / 交互异常）
  if (window.__appInitialized) { console.warn('[main] 已初始化，跳过重复执行'); return; }
  window.__appInitialized = true;
  try {
    config = await loadConfig();
  } catch (e) {
    // 配置加载失败时无法继续（约束8：所有参数读取自 config.json，禁止硬编码）
    console.error(e);
    showError();
    return;
  }
  applyTexts();
  setupJoystick();
  setupGlobalTouchGuard();
  setupPhotoUI();

  // 加载 gsplat.js 库
  try { await loadGSplat(); }
  catch (e) { console.error(e); showError(); return; }

  if (!init3D()) return; // WebGL 不支持时已显示提示
  initGridCanvas();      // 底面网格 2D 画布
  setupLookControls();   // 桌面拖动旋转 / 移动端单指旋转 + 双指升降
  setupSettings();       // 设置面板（渲染精度 / 移动速度滑块）
  setupPerfMonitor();    // 查询 GPU 信息（性能面板开关在设置中）

  // 启动渲染循环（即使模型未加载完，也先渲染空场景）
  startRenderLoop();

  // 加载模型（主链 / 备用）
  const ok = await loadModelWithFallback();
  if (!ok) return;

  // 模型加载完成后自动取景（将相机定位到模型中心）
  autoFrameModel();

  // autoFrameModel 可能根据模型尺寸调整 moveSpeed，同步到设置滑块
  const msSlider = $('moveSpeedSlider');
  const msValueEl = $('moveSpeedValue');
  if (msSlider && msValueEl) {
    msSlider.value = config.controls.moveSpeed;
    msValueEl.textContent = parseFloat(config.controls.moveSpeed).toFixed(1);
  }

  // 模型加载完成，解除 HMR 重载阻止
  window.__modelLoading = false;
  // 暴露调试信息
  window.__debug = { scene, renderer, camera, sceneObjects: scene.objects ? scene.objects.length : 0, modelBounds };

  // 淡出加载遮罩，显示操作提示
  setTimeout(() => {
    $('loading').classList.add('fade-out');
    showHint();
  }, 300);
}

/* --------------------------- 20. 拍照 UI 绑定 ------------------------- */
function setupPhotoUI() {
  $('photoBtn').addEventListener('click', openModal);
  $('btnSave').addEventListener('click', () => { exportPhoto(null); closeModal(); });
  $('btnWith').addEventListener('click', () => { exportPhoto($('photoInput').value); closeModal(); });
  $('photoInput').addEventListener('input', updatePreview);
  $('shareClose').addEventListener('click', () => $('shareView').classList.remove('show'));
  $('refreshBtn').addEventListener('click', () => location.reload());
  // 模态框遮罩点击关闭（点卡片不关）
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
  // 加载背景图列表
  loadBackgrounds();
}

// 加载背景图列表并渲染缩略图
// 优先使用静态 backgrounds.json（适配静态托管），回退 /api/backgrounds（本地服务器）
async function loadBackgrounds() {
  try {
    let data = null;
    // 1. 尝试静态 JSON 文件（GitHub Pages 等静态托管可用）
    try {
      const res = await fetch('backgrounds.json', { cache: 'no-cache' });
      if (res.ok) data = await res.json();
    } catch (e) {}
    // 2. 回退到本地服务器 API
    if (!data) {
      const res = await fetch('/api/backgrounds');
      if (!res.ok) return;
      data = await res.json();
    }
    bgList = data.backgrounds || [];
    renderBgGrid();
    // 预加载所有背景图，用户点击缩略图时即可立即使用
    bgList.forEach(bg => preloadBgImage(bg));
  } catch (e) {
    console.warn('[bg] 背景图列表加载失败', e);
  }
}

// 渲染背景缩略图网格
function renderBgGrid() {
  const grid = $('bgGrid');
  grid.innerHTML = '';
  // 无背景选项
  const noneThumb = document.createElement('div');
  noneThumb.className = 'bg-thumb none' + (selectedBg === null ? ' selected' : '');
  noneThumb.textContent = '无';
  noneThumb.addEventListener('click', () => { selectedBg = null; renderBgGrid(); updatePreview(); });
  grid.appendChild(noneThumb);
  // 背景图缩略图
  for (const bg of bgList) {
    const thumb = document.createElement('div');
    thumb.className = 'bg-thumb' + (selectedBg === bg ? ' selected' : '');
    thumb.style.backgroundImage = `url("${bg}")`;
    thumb.addEventListener('click', () => {
      selectedBg = (selectedBg === bg) ? null : bg;
      if (selectedBg) preloadBgImage(selectedBg);
      renderBgGrid();
      updatePreview();
    });
    grid.appendChild(thumb);
  }
}

// 预加载背景图 Image 对象（用于合成时绘制）
function preloadBgImage(src) {
  if (bgImageCache[src]) return bgImageCache[src];
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { if (selectedBg === src) updatePreview(); };
  img.src = src;
  bgImageCache[src] = img;
  return img;
}

// 获取已加载完成的背景图（未加载完则返回 null）
function getBgImage(src) {
  const img = bgImageCache[src];
  if (img && img.complete && img.naturalWidth > 0) return img;
  return null;
}

// 启动
main();
</script>
